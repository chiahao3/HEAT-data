paths:
  output_dir: "/data2/jt577/2026/09.2026/blob_EAT/09.07/wse2_halo_log_ellipse_composition_ga"
  import_structures_json: ""

model:
  mp_api_key: ""
  model_name: "uma-s-1p1"
  task_name: "omat"

system:
  # FairChem requires all axes to remain periodic. The finite, incommensurate
  # experimental volume is centered between about 8 A of explicit vacuum on
  # either side of x, y, and z. Lateral padding is snapped to whole image voxels.
  vacuum_padding_angstrom: "8.0, 8.0, 8.0"
  pbc: "true, true, true"
  species: "W, Se"

experimental:
  tiff_file: "/data2/jt577/2026/08.2026/blob_EAT/08.24/objp_zstack_iter0200.tif"
  crop_xy_size_source_pixels: 200
  target_xy_pixels: 200
  target_z_slices: 12
  source_voxel_size_angstrom: "1.0, 0.152564, 0.152564"
  target_background_percentile: 1.0
  target_normalization_percentile: 99.5

feasible_region:
  mask_smoothing_sigma_pixels: "0.5, 1.0, 1.0"
  threshold_mode: "percentile"
  threshold: 50.0
  level_set_margin_angstrom: 0.0
  boundary_penalty: 0.0
  boundary_sharpness: 8.0

sample_box:
  # Occupancy-normalized smooth squared distance outside the original measured
  # volume. This confines atoms without changing FairChem's xyz-periodic PBC.
  confinement_penalty: 50
  confinement_sharpness: 8.0
  confinement_margin_angstrom: 0.0

imaging:
  # Render the complete xyz-vacuum-padded periodic cell, but evaluate the loss
  # and correlation only on the embedded experimental 12x150x150 ROI.
  # This coefficient weights the existing voxelwise 3D Huber term.
  penalty: 100.0
  huber_delta: 0.20
  # Square loss between each experimental joint-fit amplitude and the W/Se
  # occupancy predicted for its adaptive ellipse. Residuals are in Se units.
  ellipse_composition_penalty: 5.0
  target_transform: "linear"
  transform_epsilon: 1.0e-6
  epsilon: 1.0e-12
  relative_intensity_reference_species: "W"
  normalize_relative_intensity_reference_peak_to_one: true
  clip_experimental_to_unit_interval: false
  additional_lateral_blur_angstrom: 0.08
  shared_sigma_z_angstrom: 3.0

experimental_peak_ellipses:
  # LoG runs on a real source-image halo, then candidate centers are mapped
  # back into the selected experimental crop.
  detection_halo_source_pixels: 16
  min_sigma_pixels: 0.6
  max_sigma_pixels: 2.5
  num_sigma: 16
  threshold_rel: 0.05
  minimum_separation_angstrom: 0.45
  # Overlap-aware normalized double-Gaussian unmixing and logical grouping.
  kernel_support_sigma: 4.5
  minimum_retained_amplitude_Se_units: 0.45
  pruning_rounds: 3
  position_refinement_rounds: 2
  position_step_pixels: 0.50
  minimum_fitted_separation_angstrom: 0.28
  merge_distance_angstrom: 0.55
  residual_addition_rounds: 1
  residual_peak_threshold_rel: 0.05
  residual_minimum_separation_angstrom: 0.35
  maximum_residual_peaks_per_round: 20
  # One shared experimental scale is fitted; the W/Se ratio remains fixed to
  # element_double_gaussian_fits.csv exactly.
  maximum_Se_count: 6
  maximum_W_count: 6
  maximum_total_atoms: 8
  initial_I_Se_for_scale_fit: 0.12117379665687308
  scale_fit_maximum_iterations: 100
  # Responsibility-deblended adaptive ellipse fitting.
  local_search_radius_angstrom: 1.40
  foreground_relative_threshold: 0.12
  minimum_covariance_sigma_angstrom: 0.12
  axis_scale_minimum: 0.65
  axis_scale_maximum: 1.80
  axis_scale_steps: 18
  angle_search_half_range_degrees: 20.0
  angle_search_steps: 9
  intensity_coverage_weight: 0.35
  # Smooth, conservative atom-to-region ownership. The background channel
  # prevents atoms outside all ellipses from being assigned to a remote region.
  membership_boundary_softness: 0.10
  membership_background_score: 0.02
  low_confidence_visible_fraction: 0.70

random_immigrant_image_prefit:
  enable: true
  initial_occupancy_mode: "uniform"
  initial_logit_noise: 0.20
  soft_steps: 500
  # Rounding and fixed-species position relaxation happen only after the
  # normal energy-inclusive syntropization, not inside this image prefit.
  final_position_steps: 0
  position_learning_rate: 0.025
  occupancy_learning_rate: 0.07
  entropy_final_weight: 1.0
  repulsion_weight: 2.0
  minimum_distance_angstrom: 1.0
  composition_penalty_enable: true
  # Preserve every soft candidate site until syntropization has rounded.
  compact_null_sites_before_fairchem: false

diagnostics:
  initial_diagnostics_enable: true
  exit_after_initial_diagnostics: false
  max_isosurface_points: 60000
  member_slice_comparisons_enable: false

effective_atoms:
  # Candidate count is based on the unpadded feasible sample volume only.
  candidate_site_density_per_angstrom3: 0.20
  initial_cylinder_lateral_radius_angstrom: 0.75
  initial_cylinder_z_radius_angstrom: 3.0
  initial_jitter_angstrom: 0.10

composition:
  composition_target: "1, 2"
  composition_penalty: 10.0
  exact_composition_enforcement_enable: false

se_vacancy_bias:
  # Disabled for the clean comparison run. The previous global Se-removal
  # incentive competed too strongly with the local ellipse information.
  # Retain the calibrated values below for possible controlled future tests.
  enable: false
  alpha_eV_per_vacancy: 1.8353
  reference_atom_count: 350.0

syntropization:
  tsallis_q: 2.0
  beta0: 1.0e-3
  beta_mult: 1.5
  beta_max_stages: 0
  entropy_stop_avg: 1.0e-3
  binary_stop_maxmin: 1.0e-3
  also_require_binary_stop: false

minimizer:
  maxit: 100
  tol: 3e-2
  bfgs_hist: 8
  max_line_search: 10
  stage_stagnation_patience: 5
  stage_stagnation_min_improvement: 3.0e-3
  final_pbfgs_enable: true
  final_pbfgs_maxit: 500
  final_pbfgs_tol: 3.0e-3
  final_pbfgs_cost_plateau_tol: 3.0e-4
  final_pbfgs_cost_plateau_patience: 10
  final_pbfgs_cost_plateau_min_iterations: 50

initialization:
  init_occ_total: 0.30
  init_occ_noise: 0.05
  init_species_mode: "dirichlet"
  init_species_dirichlet_alpha: 5.0
  keep_thresh: 1.0e-3
  seed: null

history:
  disable_trajectory_history: true
  history_every: 1

runtime:
  terminal_verbose: false
  heartbeat_interval_seconds: 60.0
  running_log_file: ""
  local_resource_log_interval_seconds: 60.0
  worker_health_check_interval_seconds: 10.0

checkpointing:
  member_progress_enable: true
  member_progress_interval_iterations: 10
  member_progress_interval_seconds: 60.0
  retain_completed_member_checkpoints: false

genetic:
  enable: true
  population_size: 50
  generations: 100
  elite_fraction: 0.10
  random_fraction: 0.25
  crossover_fraction: 0.65
  parent_pool_size: 50
  import_parent_count: 0
  crossover_pos_sigma: 0.25
  crossover_occ_sigma: 0.05
  crossover_species_sigma: 0.25
  parent_a_tournament_size: 3 # Parent A is the lowest-score member sampled by tournament A.
  parent_b_tournament_size: 3 # Parent B is the lowest-score member sampled after excluding parent A.
  diversity_subcells: "12, 12, 4" # Legacy-compatible parsed setting; crossover parent selection and alignment no longer use subcell diversity.
  # The cell remains periodic in z; only the z translation search is disabled
  # because the sample is anchored between explicit vacuum regions.
  superposition_occ_scale: 0.50
  superposition_prune_distance_angstrom: 1.0
  superposition_prune_occ_thresh: 1.0e-3
  live_plot_enable: true
  live_plot_file: ""
  live_plot_metric: "score"
  live_plot_alpha: 0.45
  live_plot_jitter: 0.16
  parallel_workers: 1
  parallel_gpu_ids: "0"
  execution_backend: "local"
  log_file: ""
  score: "guided"

